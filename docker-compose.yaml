services:
  palmr:
    # Published image (built by .github/workflows/publish-image.yml)
    image: ghcr.io/bytelake/palmr:latest
    # For local source builds instead of pulling:
    # build: .
    # image: palmr:local
    container_name: palmr
    environment:
      # ==============================================================================
      # STORAGE CONFIGURATION
      # ==============================================================================
      # By default, Palmr uses internal storage - ZERO CONFIG NEEDED!
      # Files are managed automatically with no setup required.
      #
      # Want to use external S3 storage (AWS, S3-compatible, etc)? Just add:
      # - ENABLE_S3=true                    # Enable external S3
      # - S3_ENDPOINT=s3.amazonaws.com      # Your S3 endpoint
      # - S3_ACCESS_KEY=your-access-key     # Your access key
      # - S3_SECRET_KEY=your-secret-key     # Your secret key
      # - S3_BUCKET_NAME=palmr-files        # Your bucket name
      # - S3_REGION=us-east-1               # Region (optional)
      # - S3_USE_SSL=true                   # Use SSL (optional)
      # - S3_FORCE_PATH_STYLE=false         # Path-style URLs (optional, true for Minio)
      # - S3_REJECT_UNAUTHORIZED=true       # Reject self-signed certs (optional)
      #
      # ==============================================================================
      # USER/GROUP CONFIGURATION
      # ==============================================================================
      # - PALMR_UID=1000                    # UID for container processes (optional)
      # - PALMR_GID=1000                    # GID for container processes (optional)
      #
      # ==============================================================================
      # APPLICATION SETTINGS
      # ==============================================================================
      # - DEFAULT_LANGUAGE=en-US            # Default language (optional)
      # - PRESIGNED_URL_EXPIRATION=3600     # Presigned URL expiration in seconds (optional)
      # - SECURE_SITE=true                  # REQUIRED when serving over HTTPS (sets Secure cookies)
      # - CORS_ORIGIN=https://files.example.com  # Optional CORS allowlist (comma-separated)
      # - APP_URL=https://files.example.com      # Public app URL used for OIDC redirect allowlisting
      #
      # STORAGE_URL is required for internal storage: full URL clients use to reach MinIO
      # (e.g. https://files.example.com:9379 or http://192.168.1.100:9379).
      # Not needed when ENABLE_S3=true. Set this for your deployment — do not leave a demo value.
      # STORAGE_URL: "https://your-host:9379"
      #
      # When reverse-proxying HTTPS to the web UI only, keep API/MinIO off the public internet
      # and set STORAGE_URL to a hostname your reverse proxy routes to the storage port.
    ports:
      - "5487:5487" # Web interface (proxies API internally)
      # Advanced: only publish these if you need direct access and understand the risk
      # - "3333:3333" # API (bypasses Next.js proxy)
      # - "9379:9379" # Internal MinIO (required for browser direct uploads when using internal storage)
    volumes:
      - palmr_data:/app/server
      # ==============================================================================
      # ADVANCED: Use a different disk for file storage (for larger capacity)
      # ==============================================================================
      # Uncomment the line below to store files on a different disk:
      # - /path/to/your/large/disk:/app/server/data
      #
      # Example: Mount a 2TB drive for files while keeping database on fast SSD
      # - /mnt/storage/palmr-files:/app/server/data
      #
    restart: unless-stopped

volumes:
  palmr_data:
