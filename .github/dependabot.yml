version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      root-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      web-production:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      web-development:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/apps/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      server-production:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      server-development:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-deps:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
